name: Release Plugin on Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release zip
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="${GITHUB_REPOSITORY#*/}"
          TAG_NAME="${GITHUB_REF_NAME}"
          ZIP_NAME="${PLUGIN_DIR}-${TAG_NAME}.zip"
          STAGING_DIR="${RUNNER_TEMP}/plugin-release"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/$PLUGIN_DIR"

          rsync -a ./ "$STAGING_DIR/$PLUGIN_DIR/" \
            --exclude='COPILOT_INSTRUCTIONS.md' \
            --exclude='*.ds' \
            --exclude='*.DS' \
            --exclude='.DS_Store' \
            --exclude='*/.DS_Store' \
            --exclude='.git/' \
            --exclude='.*' \
            --exclude='*/.*'

          cd "$STAGING_DIR"
          zip -r "$RUNNER_TEMP/$ZIP_NAME" "$PLUGIN_DIR"

          echo "zip_path=$RUNNER_TEMP/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        id: package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true