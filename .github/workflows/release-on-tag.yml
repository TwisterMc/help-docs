name: Release Plugin on Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release zip
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="${GITHUB_REPOSITORY#*/}"
          ZIP_NAME="${PLUGIN_DIR}.zip"
          STAGING_DIR="${RUNNER_TEMP}/plugin-release"

          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/$PLUGIN_DIR"

          rsync -a ./ "$STAGING_DIR/$PLUGIN_DIR/" \
            --exclude='COPILOT_INSTRUCTIONS.md' \
            --exclude='*.ds' \
            --exclude='*.DS' \
            --exclude='.DS_Store' \
            --exclude='*/.DS_Store' \
            --exclude='.git/' \
            --exclude='.*' \
            --exclude='*/.*'

          cd "$STAGING_DIR"
          zip -r "$RUNNER_TEMP/$ZIP_NAME" "$PLUGIN_DIR"

          # Ensure archive layout always matches WordPress expectations.
          ZIP_CONTENTS="$(zipinfo -1 "$RUNNER_TEMP/$ZIP_NAME")"
          if ! printf '%s\n' "$ZIP_CONTENTS" | grep -qx "${PLUGIN_DIR}/"; then
            echo "Release zip is missing root directory ${PLUGIN_DIR}/"
            exit 1
          fi

          if ! printf '%s\n' "$ZIP_CONTENTS" | grep -qx "${PLUGIN_DIR}/${PLUGIN_DIR}.php"; then
            echo "Release zip is missing plugin bootstrap ${PLUGIN_DIR}/${PLUGIN_DIR}.php"
            exit 1
          fi

          echo "zip_path=$RUNNER_TEMP/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        id: package

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true